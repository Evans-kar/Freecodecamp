<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <main id="playing-cards">
      <!-- Card 1 -->
      <div class="card warm">
        <div class="left">
          <div class="corner-rank">A</div>
          <div class="corner-suit">♥</div>
        </div>

        <div class="middle">
          <div class="pip">♥</div>
          <div style="font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1px;">
            AMETHYST
          </div>
          <div class="pip">♥</div>
        </div>

        <div class="right">
          <div class="corner-suit">♥</div>
          <div class="corner-rank">A</div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="left">
          <div class="corner-rank">K</div>
          <div class="corner-suit">♠</div>
        </div>

        <div class="middle">
          <div class="pip">♠</div>
          <div style="font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1px;">
            ROYAL
          </div>
          <div class="pip">♠</div>
        </div>

        <div class="right">
          <div class="corner-suit">♠</div>
          <div class="corner-rank">K</div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div class="left">
          <div class="corner-rank">7</div>
          <div class="corner-suit">♦</div>
        </div>

        <div class="middle">
          <div class="pip">♦</div>
          <div style="font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1px;">
            VIOLET
          </div>
          <div class="pip">♦</div>
        </div>

        <div class="right">
          <div class="corner-suit">♦</div>
          <div class="corner-rank">7</div>
        </div>
      </div>
    </main>
  </body>
</html>
