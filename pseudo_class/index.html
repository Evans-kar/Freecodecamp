<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Todo List</title>
</head>
<body>

  <ul class="todo-list">
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Morning Routine</label>

      <ul class="sub-item">
        <li>
          <a 
            href="https://www.reddit.com/r/DecidingToBeBetter/comments/8tr2wc/benefits_of_running_every_morning/" 
            class="sub-item-link" 
            target="_blank">
            Benefits of morning run
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Healthy Eating</label>

      <ul class="sub-item">
        <li>
          <a 
            href="https://www.healthline.com/nutrition/healthy-eating-basics" 
            class="sub-item-link" 
            target="_blank">
            Healthy eating basics
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Daily Exercise</label>

      <ul class="sub-item">
        <li>
          <a 
            href="https://www.cdc.gov/physicalactivity/basics/index.htm" 
            class="sub-item-link" 
            target="_blank">
            Physical activity guidelines
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Mental Wellness</label>

      <ul class="sub-item">
        <li>
          <a 
            href="https://www.mentalhealth.org.uk/explore-mental-health" 
            class="sub-item-link" 
            target="_blank">
            Mental health resources
          </a>
        </li>
      </ul>
    </li>
  </ul>

</body>
</html>
